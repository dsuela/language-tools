name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: write

jobs:
    unix-binaries:
        name: ${{ matrix.platform }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux-x64
                      runner: ubuntu-latest
                      spc: linux-x86_64
                      spc_checksum: 523ba4279c54c7a377156c0dd3a36adf92ee64b01e9a7f5e9e2ec084b8e458e5
                    - platform: linux-arm64
                      runner: ubuntu-24.04-arm
                      spc: linux-aarch64
                      spc_checksum: 675a3840dcdc4ed041fe20eaa54310ce019a9984c1c03951df9ec66df5795213
                    - platform: macos-x64
                      runner: macos-15-intel
                      spc: macos-x86_64
                      spc_checksum: e8b798048f62ca4960764196543b60ae703f7174aa418824cf542aeec1d2cd6a
                    - platform: macos-arm64
                      runner: macos-14
                      spc: macos-aarch64
                      spc_checksum: acf2f25d56d0cbf8e65aa82e5054fef555f7be7c5c38046c6e0819f266d83225
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - name: Install production dependencies
              run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            - name: Build the server PHAR
              run: |
                  mkdir -p var/build/release build
                  VERSION=dev
                  if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
                  printf '%s\n' "$VERSION" > resources/version
                  # Box 4.7.0 cannot compile on Windows.
                  curl -fsSL https://github.com/box-project/box/releases/download/4.6.7/box.phar -o var/build/release/box.phar
                  echo 'f49a711985219c9e0ef9faa49a95d8ab47385b8b8966dc5ac0ca10f9ac318e6b  var/build/release/box.phar' | shasum -a 256 -c
                  php var/build/release/box.phar compile --no-parallel
            - name: Build the standalone server
              working-directory: var/build/release
              env:
                  EXTENSIONS: ctype,filter,iconv,mbstring,pcntl,phar,posix,tokenizer,zlib
              run: |
                  curl -fsSL https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.5/spc-${{ matrix.spc }}.tar.gz -o spc.tar.gz
                  echo '${{ matrix.spc_checksum }}  spc.tar.gz' | shasum -a 256 -c
                  tar -xzf spc.tar.gz
                  ./spc doctor --auto-fix
                  ./spc download --with-php=8.4 --for-extensions="$EXTENSIONS"
                  ./spc build "$EXTENSIONS" --build-micro -P "$GITHUB_WORKSPACE/tools/spc-inject-tree-sitter.php"
                  ./spc micro:combine ../../../build/symfony-lsp.phar -O ../../../build/symfony-lsp
                  chmod +x ../../../build/symfony-lsp
            - name: Build the Tree-sitter sidecar
              run: composer tree-sitter:build-sidecar
            - name: Package and smoke-test
              env:
                  PLATFORM: ${{ matrix.platform }}
                  VERSION: ${{ github.ref_name }}
              run: |
                  mkdir -p "dist/symfony-lsp-$VERSION-$PLATFORM"
                  cp build/symfony-lsp "dist/symfony-lsp-$VERSION-$PLATFORM/symfony-lsp"
                  cp var/build/tree_sitter_cli/symfony-lsp-tree-sitter "dist/symfony-lsp-$VERSION-$PLATFORM/symfony-lsp-tree-sitter"
                  cp LICENSE THIRD_PARTY_NOTICES.md "dist/symfony-lsp-$VERSION-$PLATFORM/"
                  cp -R THIRD_PARTY_LICENSES "dist/symfony-lsp-$VERSION-$PLATFORM/"
                  test -f "dist/symfony-lsp-$VERSION-$PLATFORM/THIRD_PARTY_LICENSES/runtime/src_php-src_0.txt"
                  test -f "dist/symfony-lsp-$VERSION-$PLATFORM/THIRD_PARTY_LICENSES/tree-sitter/tree-sitter-twig-LICENSE"
                  "dist/symfony-lsp-$VERSION-$PLATFORM/symfony-lsp" --version
                  EXPECTED_VERSION=dev
                  if [ "$GITHUB_REF_TYPE" = tag ]; then EXPECTED_VERSION="${VERSION#v}"; fi
                  # A nonexistent sidecar proves the Tree-sitter parser is compiled into the binary.
                  ./tools/smoke-test-server "dist/symfony-lsp-$VERSION-$PLATFORM/symfony-lsp" /nonexistent-tree-sitter "$EXPECTED_VERSION"
                  tar -czf "dist/symfony-lsp-$VERSION-$PLATFORM.tar.gz" -C dist "symfony-lsp-$VERSION-$PLATFORM"
            - uses: actions/upload-artifact@v7
              with:
                  name: symfony-lsp-${{ github.ref_name }}-${{ matrix.platform }}
                  path: dist/*.tar.gz
                  if-no-files-found: error

    windows-binary:
        name: windows-x64
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - name: Install production dependencies
              run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            - name: Build the server PHAR
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force var/build/release, build | Out-Null
                  $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'dev' }
                  Set-Content -Path resources/version -Value $version
                  # Box 4.7.0 cannot compile on Windows.
                  Invoke-WebRequest https://github.com/box-project/box/releases/download/4.6.7/box.phar -OutFile var/build/release/box.phar
                  if ((Get-FileHash var/build/release/box.phar -Algorithm SHA256).Hash.ToLower() -ne 'f49a711985219c9e0ef9faa49a95d8ab47385b8b8966dc5ac0ca10f9ac318e6b') { throw 'Invalid Box checksum.' }
                  php var/build/release/box.phar compile --no-parallel
            - name: Build the standalone server
              shell: pwsh
              working-directory: var/build/release
              env:
                  EXTENSIONS: ctype,filter,iconv,mbstring,phar,tokenizer,zlib
              run: |
                  Invoke-WebRequest https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.5/spc-windows-x64.exe -OutFile spc.exe
                  if ((Get-FileHash spc.exe -Algorithm SHA256).Hash.ToLower() -ne '425b54ab857e21409c1fd9b818899ffebabd1e2817ef0a0ed5ae8a3d9f5b463b') { throw 'Invalid static-php-cli checksum.' }
                  ./spc.exe doctor --auto-fix
                  if ($LASTEXITCODE -ne 0) { throw 'spc doctor failed.' }
                  ./spc.exe download --with-php=8.4 --for-extensions="$env:EXTENSIONS"
                  if ($LASTEXITCODE -ne 0) { throw 'spc download failed.' }
                  ./spc.exe build "$env:EXTENSIONS" --build-micro -P "$env:GITHUB_WORKSPACE/tools/spc-inject-tree-sitter.php"
                  if ($LASTEXITCODE -ne 0) { throw 'spc build failed.' }
                  ./spc.exe micro:combine ../../../build/symfony-lsp.phar -O ../../../build/symfony-lsp
                  if ($LASTEXITCODE -ne 0) { throw 'spc micro:combine failed.' }
            - name: Build the Tree-sitter sidecar
              run: |
                  cmake -S ext/tree_sitter -B var/build/tree_sitter_cli -DCMAKE_BUILD_TYPE=Release
                  cmake --build var/build/tree_sitter_cli --config Release
            - name: Package and smoke-test
              timeout-minutes: 2
              shell: pwsh
              run: |
                  $package = "symfony-lsp-${{ github.ref_name }}-windows-x64"
                  New-Item -ItemType Directory -Force "dist/$package" | Out-Null
                  Copy-Item build/symfony-lsp.exe "dist/$package/symfony-lsp.exe"
                  Copy-Item var/build/tree_sitter_cli/Release/symfony-lsp-tree-sitter.exe "dist/$package/symfony-lsp-tree-sitter.exe"
                  Copy-Item -Path LICENSE, THIRD_PARTY_NOTICES.md -Destination "dist/$package/"
                  Copy-Item -Path THIRD_PARTY_LICENSES -Destination "dist/$package/THIRD_PARTY_LICENSES" -Recurse
                  if (!(Test-Path "dist/$package/THIRD_PARTY_LICENSES/runtime/src_php-src_0.txt")) { throw 'Runtime licenses are missing.' }
                  if (!(Test-Path "dist/$package/THIRD_PARTY_LICENSES/tree-sitter/tree-sitter-twig-LICENSE")) { throw 'Tree-sitter licenses are missing.' }
                  & "dist/$package/symfony-lsp.exe" --version
                  $tree = "{{ path('homepage') }}" | & "dist/$package/symfony-lsp-tree-sitter.exe" twig | ConvertFrom-Json
                  if ($tree.nodes.Count -eq 0) { throw 'The Tree-sitter sidecar returned no nodes.' }
                  $expected = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'dev' }
                  # A nonexistent sidecar proves the Tree-sitter parser is compiled into the binary.
                  php tools/smoke-test-server "dist/$package/symfony-lsp.exe" nonexistent-tree-sitter $expected
                  if ($LASTEXITCODE -ne 0) { throw 'The server smoke test failed.' }
                  Compress-Archive "dist/$package" "dist/$package.zip"
            - uses: actions/upload-artifact@v7
              with:
                  name: symfony-lsp-${{ github.ref_name }}-windows-x64
                  path: dist/*.zip
                  if-no-files-found: error

    vscode-extension:
        name: VS Code extension (${{ matrix.target }})
        needs: [unix-binaries, windows-binary]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux-x64
                      target: linux-x64
                      executable: symfony-lsp
                      sidecar: symfony-lsp-tree-sitter
                    - platform: linux-arm64
                      target: linux-arm64
                      executable: symfony-lsp
                      sidecar: symfony-lsp-tree-sitter
                    - platform: macos-x64
                      target: darwin-x64
                      executable: symfony-lsp
                      sidecar: symfony-lsp-tree-sitter
                    - platform: macos-arm64
                      target: darwin-arm64
                      executable: symfony-lsp
                      sidecar: symfony-lsp-tree-sitter
                    - platform: windows-x64
                      target: win32-x64
                      executable: symfony-lsp.exe
                      sidecar: symfony-lsp-tree-sitter.exe
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: symfony-lsp-${{ github.ref_name }}-${{ matrix.platform }}
                  path: var/vscode-server
            - name: Extract the bundled server
              env:
                  EXECUTABLE: ${{ matrix.executable }}
                  SIDECAR: ${{ matrix.sidecar }}
              run: |
                  mkdir -p editor/vscode/server var/vscode-server/extracted
                  archive="$(find var/vscode-server -maxdepth 1 -type f | head -1)"
                  case "$archive" in
                      *.tar.gz)
                          tar -xzf "$archive" --strip-components=1 -C editor/vscode/server
                          ;;
                      *.zip)
                          unzip -q "$archive" -d var/vscode-server/extracted
                          find var/vscode-server/extracted -type f -name "$EXECUTABLE" -exec cp {} editor/vscode/server/ \;
                          find var/vscode-server/extracted -type f -name "$SIDECAR" -exec cp {} editor/vscode/server/ \;
                          ;;
                      *)
                          echo "Unsupported server archive: $archive" >&2
                          exit 1
                          ;;
                  esac
                  rm -rf editor/vscode/server/LICENSE editor/vscode/server/THIRD_PARTY_LICENSES editor/vscode/server/THIRD_PARTY_NOTICES.md
                  test -f "editor/vscode/server/$EXECUTABLE"
                  test -f "editor/vscode/server/$SIDECAR"
                  if [[ "$EXECUTABLE" != *.exe ]]; then chmod +x editor/vscode/server/*; fi
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: editor/vscode/package-lock.json
            - name: Build the VS Code extension
              working-directory: editor/vscode
              env:
                  EXECUTABLE: ${{ matrix.executable }}
                  SIDECAR: ${{ matrix.sidecar }}
                  TARGET: ${{ matrix.target }}
                  VERSION: ${{ github.ref_name }}
              run: |
                  npm ci
                  mkdir -p dist
                  options=(--target "$TARGET")
                  if [[ "$VERSION" == *-* ]]; then options=(--pre-release "${options[@]}"); fi
                  npm run package -- "${options[@]}" --out "dist/symfony-lsp-$VERSION-$TARGET.vsix"
                  manifest="$(unzip -p "dist/symfony-lsp-$VERSION-$TARGET.vsix" extension.vsixmanifest)"
                  if [[ "$VERSION" == *-* ]]; then
                      grep -Fq 'Microsoft.VisualStudio.Code.PreRelease' <<< "$manifest"
                  elif grep -Fq 'Microsoft.VisualStudio.Code.PreRelease' <<< "$manifest"; then
                      echo "Stable release contains a prerelease VSIX" >&2
                      exit 1
                  fi
                  npx vsce ls | grep -Fx 'images/icon.png'
                  npx vsce ls | grep -Fx "server/$EXECUTABLE"
                  npx vsce ls | grep -Fx "server/$SIDECAR"
                  npx vsce ls | grep -Fx 'THIRD_PARTY_NOTICES.md'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_LICENSES/runtime/src_php-src_0.txt'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_LICENSES/tree-sitter/tree-sitter-twig-LICENSE'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_LICENSES/vscode/vscode-languageclient/LICENSE'
            - uses: actions/upload-artifact@v7
              with:
                  name: symfony-lsp-${{ github.ref_name }}-vscode-${{ matrix.target }}
                  path: editor/vscode/dist/*.vsix
                  if-no-files-found: error

    release:
        name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        needs: [unix-binaries, windows-binary, vscode-extension]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  path: dist
            - name: Generate checksums
              run: |
                  find dist -type f -print0 | sort -z | xargs -0 sha256sum | awk '{ name = $2; sub(/^.*\//, "", name); print $1 "  " name }' > SHA256SUMS
                  mv SHA256SUMS dist/SHA256SUMS
            - uses: softprops/action-gh-release@v3
              with:
                  files: |
                      dist/**/*.tar.gz
                      dist/**/*.zip
                      dist/**/*.vsix
                      dist/SHA256SUMS
                  fail_on_unmatched_files: true
                  body_path: CHANGELOG.md
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  draft: true
            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
                  PRERELEASE: ${{ contains(github.ref_name, '-') }}
              run: gh release edit "${{ github.ref_name }}" --draft=false --prerelease="$PRERELEASE"

    marketplace:
        name: Publish VS Code extension
        if: startsWith(github.ref, 'refs/tags/')
        needs: release
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/publish-vscode.yaml
        with:
            tag: ${{ github.ref_name }}
